name: Update Pathfinder Dashboard

# Runs automatically once a day and rebuilds index.html from the live Google
# Sheets. Also runnable manually anytime from the Actions tab (workflow_dispatch)
# if you want a fresh pull right now instead of waiting for the schedule.
#
# Zero cost: this uses GitHub's free Actions minutes and the built-in
# GITHUB_TOKEN (no secrets to set up). Nothing here talks to Claude.

on:
  schedule:
    # 00:00 UTC daily. Adjust the two numbers "minute hour" to change the time
    # (cron is always UTC — e.g. '30 0 * * *' = 00:30 UTC).
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Rebuild dashboard from live sheets
        run: python build_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "pathfinder-dashboard-bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update dashboard data $(date -u +%Y-%m-%d)"
          git push
